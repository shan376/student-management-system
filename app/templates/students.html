# Updated students.html

```html
{% extends "base.html" %}

{% block title %}Students{% endblock %}

{% block content %}

<h2>Students List</h2>

<table class="table table-bordered">

    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Action</th>
    </tr>

    {% for student in students %}

    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.course }}</td>

        <td>
            <a href="/edit-student/{{ student.id }}" class="btn btn-warning btn-sm">

        Edit

    </a>
            <a href="/delete-student/{{ student.id }}" class="btn btn-danger btn-sm">
                Delete
            </a>
        </td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
```
